name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        id: build_debug
        shell: bash
        run: set -o pipefail && ./gradlew assembleDebug 2>&1 | tee build-output.log

      - name: Build release APK
        id: build_release
        if: success()
        shell: bash
        run: set -o pipefail && ./gradlew assembleRelease 2>&1 | tee -a build-output.log

      - name: Run debug unit tests
        id: test_debug
        if: success()
        shell: bash
        run: set -o pipefail && ./gradlew testDebugUnitTest 2>&1 | tee test-output.log

      - name: Run release unit tests
        id: test_release
        if: success()
        shell: bash
        run: set -o pipefail && ./gradlew testReleaseUnitTest 2>&1 | tee -a test-output.log

      - name: Post failure comment on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## CI Build/Test Failure\n\n';

            for (const file of ['build-output.log', 'test-output.log']) {
              if (fs.existsSync(file)) {
                const content = fs.readFileSync(file, 'utf8');
                const lines = content.split('\n');
                const errorLines = lines.filter(l =>
                  /error:|FAILURE|FAILED|Exception|> Task.*FAILED/i.test(l)
                ).slice(0, 50);
                if (errorLines.length > 0) {
                  const label = file.replace('-output.log', '');
                  body += `### ${label} errors\n\`\`\`\n${errorLines.join('\n')}\n\`\`\`\n\n`;
                }
              }
            }

            const tail = (file, n) => {
              if (!fs.existsSync(file)) return '';
              const lines = fs.readFileSync(file, 'utf8').split('\n');
              return lines.slice(-n).join('\n');
            };

            body += '### Last 30 lines of build log\n```\n' + tail('build-output.log', 30) + '\n```\n';
            if (fs.existsSync('test-output.log')) {
              body += '\n### Last 30 lines of test log\n```\n' + tail('test-output.log', 30) + '\n```\n';
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body.slice(0, 65000),
            });

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            build-output.log
            test-output.log

  instrumented-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write YouTube OAuth credentials
        run: |
          echo "youtube.client.id=${{ secrets.YOUTUBE_CLIENT_ID }}" >> local.properties
          echo "youtube.client.secret=${{ secrets.YOUTUBE_CLIENT_SECRET }}" >> local.properties

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: instrumented-test-results
          path: app/build/reports/androidTests/

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write YouTube OAuth credentials
        run: |
          echo "youtube.client.id=${{ secrets.YOUTUBE_CLIENT_ID }}" >> local.properties
          echo "youtube.client.secret=${{ secrets.YOUTUBE_CLIENT_SECRET }}" >> local.properties

      - name: Run Android Lint
        id: lint
        shell: bash
        run: set -o pipefail && ./gradlew lintDebug 2>&1 | tee lint-output.log

      - name: Post lint failure comment on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## CI Lint Failure\n\n';

            if (fs.existsSync('lint-output.log')) {
              const content = fs.readFileSync('lint-output.log', 'utf8');
              const lines = content.split('\n');
              const errorLines = lines.filter(l =>
                /error:|FAILURE|FAILED|Error:/i.test(l)
              ).slice(0, 50);
              if (errorLines.length > 0) {
                body += '### Lint errors\n```\n' + errorLines.join('\n') + '\n```\n\n';
              }
              body += '### Last 30 lines\n```\n' + lines.slice(-30).join('\n') + '\n```\n';
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body.slice(0, 65000),
            });

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lint-results
          path: |
            app/build/reports/lint-results-debug.html
            lint-output.log
