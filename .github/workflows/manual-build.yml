name: Manual Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      run_tests:
        description: 'Run unit tests'
        required: false
        default: true
        type: boolean
      run_lint:
        description: 'Run lint checks'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  manual-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write YouTube OAuth credentials
        run: |
          echo "youtube.client.id=${{ secrets.YOUTUBE_CLIENT_ID }}" >> local.properties
          echo "youtube.client.secret=${{ secrets.YOUTUBE_CLIENT_SECRET }}" >> local.properties

      - name: Run unit tests
        if: inputs.run_tests
        run: ./gradlew testDebugUnitTest

      - name: Run lint
        if: inputs.run_lint
        run: ./gradlew lintDebug

      - name: Decode keystore
        if: inputs.build_type == 'release' && env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/release.keystore

      - name: Build APK
        env:
          KEYSTORE_FILE: ${{ inputs.build_type == 'release' && secrets.KEYSTORE_BASE64 != '' && format('{0}/release.keystore', github.workspace) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          BASENAME=$(basename "$APK")
          echo "apk_name=$BASENAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.find_apk.outputs.apk_name }}
          path: ${{ steps.find_apk.outputs.apk_path }}

      - name: Upload lint results
        if: inputs.run_lint
        uses: actions/upload-artifact@v6
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html

      - name: Upload test results
        if: inputs.run_tests && always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: app/build/reports/tests/

      - name: Clean up keystore
        if: always()
        run: rm -f ${{ github.workspace }}/release.keystore

      - name: Build summary
        run: |
          echo "## Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Type:** ${{ inputs.build_type }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tests:** ${{ inputs.run_tests && 'Passed' || 'Skipped' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Lint:** ${{ inputs.run_lint && 'Ran' || 'Skipped' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **APK:** \`${{ steps.find_apk.outputs.apk_name }}\`" >> "$GITHUB_STEP_SUMMARY"
