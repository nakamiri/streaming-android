name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update versionName in build.gradle.kts
        run: |
          sed -i "s/versionName = \".*\"/versionName = \"${{ steps.version.outputs.version }}\"/" app/build.gradle.kts

      - name: Extract app metadata
        id: metadata
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          APP_NAME=$(grep -oP '(?<=<string name="app_name">).*(?=</string>)' app/src/main/res/values/strings.xml | tr '[:upper:] ' '[:lower:]-' | tr -cd 'a-z0-9.-')
          APK_SUFFIX=""
          if [ -z "$KEYSTORE_BASE64" ]; then
            APK_SUFFIX="-unsigned"
          fi
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APP_NAME}-${{ steps.version.outputs.version }}${APK_SUFFIX}.apk" >> "$GITHUB_OUTPUT"

      - name: Write YouTube OAuth credentials
        run: |
          echo "youtube.client.id=${{ secrets.YOUTUBE_CLIENT_ID }}" >> local.properties
          echo "youtube.client.secret=${{ secrets.YOUTUBE_CLIENT_SECRET }}" >> local.properties

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/release.keystore

      - name: Build release APK (signed)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Build release APK (unsigned)
        if: env.KEYSTORE_BASE64 == ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: ./gradlew assembleRelease

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          RENAMED_APK=app/build/outputs/apk/release/${{ steps.metadata.outputs.apk_name }}
          mv "$APK" "$RENAMED_APK"
          echo "apk_path=$RENAMED_APK" >> "$GITHUB_OUTPUT"
          echo "apk_name=${{ steps.metadata.outputs.apk_name }}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          # Get commits since last tag
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "${GITHUB_REF_NAME}" ]; then
            CHANGES=$(git log --pretty=format:"- %s" -20)
          else
            CHANGES=$(git log --pretty=format:"- %s" "${PREV_TAG}..${GITHUB_REF_NAME}")
          fi
          {
            echo "changes<<EOF"
            echo "$CHANGES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Reaream ${{ steps.version.outputs.version }}
          body: |
            ## Reaream ${{ steps.version.outputs.version }}

            ### Changes
            ${{ steps.changelog.outputs.changes }}

            ### Installation
            1. Download `${{ steps.find_apk.outputs.apk_name }}`
            2. Enable "Install from unknown sources" on your Android device
            3. Install the APK
          files: ${{ steps.find_apk.outputs.apk_path }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}

      - name: Clean up keystore
        if: always()
        run: rm -f ${{ github.workspace }}/release.keystore
